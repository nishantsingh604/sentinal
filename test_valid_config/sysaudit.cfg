# CIS 341 - System Audit Configuration
# Format: KEY=VALUE (no spaces around =)

# Workspace and files
AUDIT_DIR=/course_project/audit
ARCHIVE_DIR=/course_project/audit
LOG_FILE=/var/log/sysaudit_daemon.log
RAW_FILE_EXTENSION=.audit
ARCHIVE_EXTENSION=.tar.gz

# Monitoring
SCAN_INTERVAL_SECONDS=60
STORAGE_LIMIT_MB=100

# Archive scheduling and cleanup
ARCHIVE_INTERVAL_DAYS=3
ARCHIVE_HOUR=23
RETENTION_DAYS=14

# Security
AUTHORIZED_USER=auditmanager
